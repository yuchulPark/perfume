# Opt-in infrastructure only. Does not override any existing service.
# docker compose -f compose.yaml -f compose.elasticsearch.yaml --profile search up -d --no-deps elasticsearch
services:
  elasticsearch:
    profiles: [search]
    build:
      context: ./docker/elasticsearch
    image: perfume-elasticsearch-nori:8.19.23
    restart: unless-stopped
    cpus: 1.0
    mem_limit: 2g
    environment:
      discovery.type: single-node
      cluster.name: perfume-search
      node.name: perfume-search-01
      network.host: 0.0.0.0
      # Bind internode transport to loopback; only HTTPS is reachable on the private network.
      transport.host: 127.0.0.1
      xpack.security.enabled: "true"
      xpack.security.autoconfiguration.enabled: "false"
      xpack.security.enrollment.enabled: "false"
      xpack.security.http.ssl.enabled: "true"
      xpack.security.http.ssl.key: certs/server.key
      xpack.security.http.ssl.certificate: certs/server.crt
      xpack.security.http.ssl.certificate_authorities: certs/ca.crt
      xpack.ml.enabled: "false"
      xpack.license.self_generated.type: basic
      # Small development node: avoid requiring an Ubuntu sysctl change.
      node.store.allow_mmap: "false"
      ES_JAVA_OPTS: -Xms1g -Xmx1g
      ELASTIC_PASSWORD_FILE: /run/secrets/elastic_bootstrap_password
    secrets:
      - elastic_bootstrap_password
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
      - ./.secrets/elasticsearch/node:/usr/share/elasticsearch/config/certs:ro
    networks: [search]
    # Deliberately no host ports and no dependency on db, backend or Ollama.
    healthcheck:
      # TLS/reachability only; authenticated cluster/index checks are an explicit operator action.
      test: [CMD-SHELL, 'test "$$(curl -s --cacert config/certs/ca.crt -o /dev/null -w "%{http_code}" https://localhost:9200/)" = 401']
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

networks:
  search:
    internal: true

volumes:
  elasticsearch-data:

secrets:
  elastic_bootstrap_password:
    file: ./.secrets/elasticsearch/elastic-password
