spring.application.name=perfume

server.port=8081

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/perfume}
spring.datasource.username=${DB_USERNAME:perfume_user}
spring.datasource.password=${DB_PASSWORD}

spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

scentrev.base-url=https://api.scentrev.com
scentrev.api-key=${SCENTREV_API_KEY:}

# Administrator CLI only. No AI beans, calls or schema initialization in ordinary web mode.
perfume.ai.embedding.batch.enabled=false
perfume.ai.embedding.auto.enabled=false

# Read-only semantic API is opt-in; no search model calls or AI schema checks by default.
perfume.ai.search.enabled=false

# Local validation only; requires search.enabled=true and a separate full LLM model digest.
perfume.ai.recommend.enabled=false

# Authentication is staged separately from the existing catalog and AI data.
perfume.auth.enabled=${PERFUME_AUTH_ENABLED:false}
perfume.auth.dev-http.enabled=${PERFUME_AUTH_DEV_HTTP_ENABLED:false}
perfume.auth.dev-http.origin=${PERFUME_AUTH_DEV_HTTP_ORIGIN:}
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${PERFUME_AUTH_COOKIE_SECURE:true}
server.servlet.session.tracking-modes=cookie
server.servlet.session.timeout=30m

# Opt-in only. Apply the reviewed support-only SQL manually before activation.
perfume.support.enabled=${PERFUME_SUPPORT_ENABLED:false}
perfume.support.allowed-origins=${PERFUME_SUPPORT_ALLOWED_ORIGINS:}
