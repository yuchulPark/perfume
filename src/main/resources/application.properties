spring.application.name=perfume

server.port=8081

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/perfume}
spring.datasource.username=${DB_USERNAME:perfume_user}
spring.datasource.password=${DB_PASSWORD}

spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

scentrev.base-url=https://api.scentrev.com
scentrev.api-key=${SCENTREV_API_KEY:}

# Administrator CLI only. No AI beans, calls or schema initialization in ordinary web mode.
perfume.ai.embedding.batch.enabled=false

# Read-only semantic API is opt-in; no search model calls or AI schema checks by default.
perfume.ai.search.enabled=false
