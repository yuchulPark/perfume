# Private Ubuntu VM only: startup additionally requires explicit opt-in and a pinned LAN origin.
# This profile does not relax strong password checks or use the isolated auth-dev database.
server.servlet.session.cookie.secure=false
# An old Secure JSESSIONID on the same IP must not block HTTP cookie creation.
server.servlet.session.cookie.name=PERFUME_DEV_SESSION
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.tracking-modes=cookie
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.sql.init.mode=never
