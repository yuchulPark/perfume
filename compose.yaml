name: perfume-dev

services:
  db:
    # Operator-managed override only; Jenkins never pulls or recreates this service.
    # A pgvector override must be an Image ID recorded in .env.pgvector-approval.json.
    image: ${PERFUME_DB_IMAGE:-postgres:17-bookworm}
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-perfume}
      POSTGRES_USER: ${DB_USERNAME:-perfume_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    ports:
      # SSH forwards to this host-only port; never publish PostgreSQL on all interfaces.
      - "127.0.0.1:15432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - data
      # Port publishing needs a non-internal network. Only db joins this network.
      - db-access
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DB_URL: jdbc:postgresql://db:5432/${DB_NAME:-perfume}
      DB_USERNAME: ${DB_USERNAME:-perfume_user}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      # Web deployment has no provider credential; the image also disables the importer.
      SCENTREV_API_KEY: ""
      # Staged authentication. Prepare auth schema/admin separately before opt-in.
      PERFUME_AUTH_ENABLED: ${PERFUME_AUTH_ENABLED:-false}
      PERFUME_AUTH_COOKIE_SECURE: "true"
      # Separate support-only schema must be approved/applied before opt-in.
      PERFUME_SUPPORT_ENABLED: ${PERFUME_SUPPORT_ENABLED:-false}
      PERFUME_SUPPORT_ALLOWED_ORIGINS: ${PERFUME_SUPPORT_ALLOWED_ORIGINS:-}
      # Opt-in LAN development only. Full model digests come from the operator's .env.
      PERFUME_AI_SEARCH_ENABLED: ${PERFUME_AI_SEARCH_ENABLED:-false}
      PERFUME_AI_SEARCH_MODEL_DIGEST: ${PERFUME_AI_SEARCH_MODEL_DIGEST:-}
      PERFUME_AI_RECOMMEND_ENABLED: ${PERFUME_AI_RECOMMEND_ENABLED:-false}
      PERFUME_AI_RECOMMEND_MODEL_DIGEST: ${PERFUME_AI_RECOMMEND_MODEL_DIGEST:-}
      PERFUME_AI_SEARCH_MODEL: "qwen3-embedding:0.6b"
      PERFUME_AI_SEARCH_READ_TIMEOUT_MS: "60000"
      PERFUME_AI_SEARCH_REQUEST_TIMEOUT_MS: "120000"
      PERFUME_AI_SEARCH_MAX_CONCURRENT: "1"
      PERFUME_AI_RECOMMEND_MODEL: "qwen3:4b-instruct"
      PERFUME_AI_RECOMMEND_READ_TIMEOUT_MS: "300000"
      PERFUME_AI_RECOMMEND_GENERATION_TIMEOUT_MS: "300000"
      PERFUME_AI_RECOMMEND_REQUEST_TIMEOUT_MS: "420000"
      PERFUME_AI_RECOMMEND_MAX_CONCURRENT: "1"
    expose:
      - "8081"
    networks:
      - app
      - data
      - ai
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      # This uses only the stored catalog, with one item, and never invokes ScentRev.
      test: ["CMD-SHELL", "curl --fail --silent --max-time 5 'http://127.0.0.1:8081/api/perfumes?size=1' > /dev/null"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8088:80"
    networks:
      - web
      - app
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  ollama:
    image: ollama/ollama:0.40.4
    restart: unless-stopped
    # Leave capacity for PostgreSQL, Jenkins and the existing applications on a 4-core/16GB VM.
    cpus: 3.0
    mem_limit: 6g
    environment:
      OLLAMA_HOST: "0.0.0.0:11434"
      OLLAMA_NO_CLOUD: "1"
      OLLAMA_VULKAN: "0"
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_CONTEXT_LENGTH: "4096"
      OLLAMA_KEEP_ALIVE: "5m"
    # No host port, GPU devices or custom startup command. Model pulls are manual:
    # qwen3:4b-instruct and qwen3-embedding:0.6b (see docs/ollama-infrastructure.md).
    expose:
      - "11434"
    volumes:
      - ollama-data:/root/.ollama
    networks:
      - ai
      # Only Ollama joins this bridge to download models; it publishes no ports.
      - ollama-download
    healthcheck:
      # Checks the daemon without loading or downloading a model; an empty store is healthy.
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

# Container/image/network names use the perfume-dev project; keep the DB volume fixed.
# No container_name or stock resource is used.
volumes:
  pgdata:
    name: perfume-dev_pgdata
  ollama-data:
    name: perfume-dev_ollama-data

networks:
  web:
  db-access:
  app:
    internal: true
  data:
    internal: true
  ai:
    internal: true
  ollama-download:
